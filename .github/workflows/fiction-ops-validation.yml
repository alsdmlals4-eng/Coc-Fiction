name: Fiction operating system

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "**/00_운영체계/**"
      - "docs/fiction-ops/**"
      - "docs/coordination/**"
      - "docs/base-reuse-adoption.json"
      - "templates/fiction-ops/**"
      - "skills/fiction-*/**"
      - "skills/FICTION_SKILL_LEARNING_LOG.md"
      - "fiction/**"
      - "tests/test_current_state_closure.py"
      - "tests/test_fiction_docx_packaging.py"
      - "tests/test_promote_021_025_contract.py"
      - "tests/test_promote_026_030_contract.py"
      - "tests/test_promote_031_035_contract.py"
      - "tests/test_promote_036_040_contract.py"
      - "tests/test_promote_041_045_contract.py"
      - "tools/**"
      - ".github/workflows/fiction-ops-validation.yml"
      - ".github/PULL_REQUEST_TEMPLATE/fiction-change.md"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "**/00_운영체계/**"
      - "docs/fiction-ops/**"
      - "docs/coordination/**"
      - "docs/base-reuse-adoption.json"
      - "templates/fiction-ops/**"
      - "skills/fiction-*/**"
      - "skills/FICTION_SKILL_LEARNING_LOG.md"
      - "fiction/**"
      - "tests/test_current_state_closure.py"
      - "tests/test_fiction_docx_packaging.py"
      - "tests/test_promote_021_025_contract.py"
      - "tests/test_promote_026_030_contract.py"
      - "tests/test_promote_031_035_contract.py"
      - "tests/test_promote_036_040_contract.py"
      - "tests/test_promote_041_045_contract.py"
      - "tools/check_fiction_docx_packaging.py"
      - "tools/check_fiction_operating_system.py"
      - "tools/check_fiction_content.py"
      - "tools/build_fiction_reverse_outline.py"
      - "tools/check_fiction_reverse_outline.py"
      - "tools/check_fiction_scene_passes.py"
      - "tools/fiction_composed_data.py"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One-time close PR57 frontier receipt
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/close-pr57-frontier-receipt-20260824'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_BRANCH"
          git checkout "$HEAD_BRANCH"
          python tools/_close_pr57_receipt.py
          python tools/_dedupe_pr57_receipt.py
          if git diff --quiet; then
            echo "PR57 frontier receipt already closed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/fiction-ops fiction "[소설]/00_운영체계/START_HERE.md"
            git commit -m "docs: close PR57 frontier receipt"
            git push origin HEAD:"$HEAD_BRANCH"
            echo "branch updated; this run intentionally stops before validation"
            exit 1
          fi
      - name: Validate Base reuse adoption manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/base-reuse-adoption.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['schema_version'] == 1
          assert data['base_source_commit'] == '8553678f70e22f193a2336b591f677dcfa5a8965'
          modules = data['modules']
          expected = {'RM-TOOL-001': 'planned','RM-SYS-001': 'not_applicable','RM-SYS-003': 'not_applicable','RM-VIS-001': 'not_applicable','RM-VIS-002': 'not_applicable'}
          assert {key: value['state'] for key, value in modules.items()} == expected
          print('base reuse adoption manifest pass')
          PY
      - name: Validate fiction operating system
        run: python tools/check_fiction_operating_system.py
      - name: Validate active fiction canon and manuscript
        run: python tools/check_fiction_content.py
      - name: Check reverse-outline reproducibility
        run: python tools/build_fiction_reverse_outline.py --check
      - name: Validate reverse-outline analysis
        run: python tools/check_fiction_reverse_outline.py
      - name: Validate completed scene passes
        run: python tools/check_fiction_scene_passes.py
      - name: Validate current-state closure contract
        run: python -m unittest tests.test_current_state_closure -v
      - name: Validate DOCX packaging contract
        run: python -m unittest tests.test_fiction_docx_packaging -v
      - name: Validate Ch021-025 historical promotion contract
        run: python -m unittest tests.test_promote_021_025_contract -v
      - name: Validate Ch026-030 historical promotion contract
        run: python -m unittest tests.test_promote_026_030_contract -v
      - name: Validate Ch031-035 historical promotion contract
        run: python -m unittest tests.test_promote_031_035_contract -v
      - name: Validate Ch036-040 historical promotion contract
        run: python -m unittest tests.test_promote_036_040_contract -v
      - name: Validate Ch041-045 promotion contract
        run: python -m unittest tests.test_promote_041_045_contract -v
