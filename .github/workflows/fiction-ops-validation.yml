name: Fiction operating system

on:
  pull_request:
    paths:
      - "**/00_운영체계/**"
      - "docs/fiction-ops/**"
      - "docs/coordination/**"
      - "docs/base-reuse-adoption.json"
      - "templates/fiction-ops/**"
      - "skills/fiction-*/**"
      - "skills/FICTION_SKILL_LEARNING_LOG.md"
      - "fiction/**"
      - "tools/check_fiction_operating_system.py"
      - "tools/check_fiction_content.py"
      - "tools/build_fiction_reverse_outline.py"
      - "tools/check_fiction_reverse_outline.py"
      - "tools/check_fiction_scene_passes.py"
      - "tools/fiction_composed_data.py"
      - ".github/workflows/fiction-ops-validation.yml"
      - ".github/PULL_REQUEST_TEMPLATE/fiction-change.md"
  push:
    branches: [main]
    paths:
      - "**/00_운영체계/**"
      - "docs/fiction-ops/**"
      - "docs/coordination/**"
      - "docs/base-reuse-adoption.json"
      - "templates/fiction-ops/**"
      - "skills/fiction-*/**"
      - "skills/FICTION_SKILL_LEARNING_LOG.md"
      - "fiction/**"
      - "tools/check_fiction_operating_system.py"
      - "tools/check_fiction_content.py"
      - "tools/build_fiction_reverse_outline.py"
      - "tools/check_fiction_reverse_outline.py"
      - "tools/check_fiction_scene_passes.py"
      - "tools/fiction_composed_data.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Base reuse adoption manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/base-reuse-adoption.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['schema_version'] == 1
          assert data['base_source_commit'] == '8553678f70e22f193a2336b591f677dcfa5a8965'
          modules = data['modules']
          expected = {
              'RM-TOOL-001': 'planned',
              'RM-SYS-001': 'not_applicable',
              'RM-SYS-003': 'not_applicable',
              'RM-VIS-001': 'not_applicable',
              'RM-VIS-002': 'not_applicable',
          }
          assert {key: value['state'] for key, value in modules.items()} == expected
          print('base reuse adoption manifest pass')
          PY
      - name: Validate fiction operating system
        run: python tools/check_fiction_operating_system.py
      - name: Diagnose promoted chapter hashes
        run: |
          python - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          text = Path('fiction/manuscript/part-1/006-010.md').read_text(encoding='utf-8')
          pattern = re.compile(r'^## 제(\d+)화 · (.*?)\n\n\*\*POV:\*\* ([^\n]+)\n\n(.*?)(?=\n\n<!-- source-lines:)', re.M | re.S)
          for match in pattern.finditer(text):
              number = int(match.group(1))
              body = match.group(4).strip()
              print(number, len(body), hashlib.sha256(body.encode('utf-8')).hexdigest())
          PY
      - name: Validate active fiction canon and manuscript
        run: python tools/check_fiction_content.py
      - name: Check reverse-outline reproducibility
        run: python tools/build_fiction_reverse_outline.py --check
      - name: Validate reverse-outline analysis
        run: python tools/check_fiction_reverse_outline.py
      - name: Validate completed scene passes
        run: python tools/check_fiction_scene_passes.py
