name: One-time materialize Ch026-030

on:
  pull_request:
    branches: [main]
    paths:
      - tools/_payload_026_030.part1.txt
      - tools/_payload_026_030.part2.txt
      - tools/_payload_026_030.part3.txt
      - .github/trigger-026-030.txt

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: promote/026-030-current-source-20260824
      - name: Materialize exact source body from chunked payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, zlib

          parts = [Path(f'tools/_payload_026_030.part{i}.txt').read_text().strip() for i in (1, 2, 3)]
          payload = ''.join(parts)
          print('part_lengths=', [len(x) for x in parts])
          print('payload_len=', len(payload), 'mod4=', len(payload) % 4)
          compressed = base64.b64decode(payload)
          data = zlib.decompress(compressed)
          expected_file_sha = '5efa519c30ad9d1bfa18bc0b2c04f93ad1fcf2351ef203fcfb4074611bc2af05'
          actual_file_sha = hashlib.sha256(data).hexdigest()
          assert actual_file_sha == expected_file_sha, (actual_file_sha, len(data))

          target = Path('fiction/manuscript/part-1/026-030.md')
          target.write_bytes(data)

          text = data.decode('utf-8')
          pat = re.compile(r'^## 제(\d+)화 · (.*?)\n\n\*\*POV:\*\* ([^\n]+)\n\n(.*?)(?=\n\n<!-- source-lines:)', re.M | re.S)
          expected = {
            26:(5852,'9af7d74668a8deeab176923f704514f1dc8fd9ba2996efef2bd4c1869db64539'),
            27:(7317,'341f3d7d86018f7c02a2fe9f396e9e5e0a30b985b9185d50dfa3791a343dc9b8'),
            28:(6334,'a809db4608f35c625d421288b62176e85480bf1b74ac8a61f63627547f0022f6'),
            29:(6545,'cb8095dff21ba84a94433460df1b50e0b2b5a6e0930a8b846e3248f93db33891'),
            30:(6499,'5ca93e6979b8beaa0d6ffe07809c664c0b7b907387b47b1732b431be364baac1'),
          }
          got = {}
          for m in pat.finditer(text):
            body = m.group(4).strip()
            n = int(m.group(1))
            got[n] = (len(body), hashlib.sha256(body.encode()).hexdigest())
          assert got == expected, got
          assert '히템' not in text
          print('exact_source_receipt=PASS')
          PY
      - name: Commit exact manuscript
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fiction/manuscript/part-1/026-030.md
          git diff --cached --quiet && exit 0
          git commit -m 'promote: install exact user-source Ch026-030 body'
          git push origin HEAD:promote/026-030-current-source-20260824
