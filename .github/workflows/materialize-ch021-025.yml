name: Materialize Ch021-025 exact candidate

on:
  push:
    branches:
      - work/coc-promote-021-025-20260821
    paths:
      - "docs/coordination/.tmp/ch021-025.current.md.gz.b64"
      - ".github/workflows/materialize-ch021-025.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize and verify exact candidate bundle
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import re
          from pathlib import Path

          payload = Path('docs/coordination/.tmp/ch021-025.current.md.gz.b64').read_text(encoding='utf-8').strip()
          raw = gzip.decompress(base64.b64decode(payload))
          expected_file_sha = '3ce5aeb71bea4ee5a4565cf30b4794e08489622d3e450fcae285213d68ffe48c'
          actual_file_sha = hashlib.sha256(raw).hexdigest()
          assert actual_file_sha == expected_file_sha, (actual_file_sha, expected_file_sha)

          target = Path('fiction/manuscript/part-1/021-025.md')
          target.write_bytes(raw)

          text = raw.decode('utf-8')
          chapter_re = re.compile(
              r'^## 제(\d+)화 · (.*?)\n\n\*\*POV:\*\* ([^\n]+)\n\n(.*?)(?=\n\n<!-- source-lines:)',
              re.M | re.S,
          )
          expected = {
              21: (6472, 'feb8df2a30c678e174a8cafbbeb8e33ec4d64042339f514a8b771e3b5b61b389'),
              22: (5916, '6ae4dba9533cad99139cfef11fdadfbddf5a381bf95091bc939296694c68e801'),
              23: (6779, 'cd506e7449f718dfdda9d67db3aba654619457991ffb0fe0cba2ef43f660c40b'),
              24: (6961, 'c111f79f73c034a6bc2f5dea8606e8b35c687b6a55842a6fd873adbda18b8549'),
              25: (5870, '09a945739b8438e30b3721c4c777a0f1c4736f5d6ac7a0684f02877e399869e8'),
          }
          found = {}
          for match in chapter_re.finditer(text):
              n = int(match.group(1))
              body = match.group(4).strip()
              found[n] = (len(body), hashlib.sha256(body.encode('utf-8')).hexdigest())
          assert found == expected, found
          print('exact Ch021-025 candidate materialization PASS')
          PY
      - name: Commit exact bundle and remove transfer-only files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fiction/manuscript/part-1/021-025.md
          git rm docs/coordination/.tmp/ch021-025.current.md.gz.b64
          git rm .github/workflows/materialize-ch021-025.yml
          git commit -m "fiction: install exact current chapters 021-025 source"
          git push origin HEAD:work/coc-promote-021-025-20260821
