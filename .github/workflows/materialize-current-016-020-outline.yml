name: Materialize current Ch016-020 outline

on:
  push:
    branches:
      - work/coc-promote-016-020-green-20260820
    paths:
      - ".github/workflows/materialize-current-016-020-outline.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/coc-promote-016-020-green-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate exact overrides from repository generator
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_fiction_reverse_outline.py --materialize /tmp/current_outline.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          generated = json.loads(Path('/tmp/current_outline.json').read_text(encoding='utf-8'))
          by = {int(x['chapter']): x for x in generated['chapters']}

          p = root / 'fiction/analysis/REVERSE_OUTLINE_OVERRIDE_011_015.json'
          old = json.loads(p.read_text(encoding='utf-8'))
          old['status'] = 'ACTIVE_OVERRIDE / BUNDLE_011_015 / CURRENT_RECONCILED / CURRENT_CONTINUITY_TO_016'
          old['chapters'] = [by[n] if n == 15 else x for x in old['chapters'] for n in [int(x['chapter'])]]
          p.write_text(json.dumps(old, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          out_16_20 = {
              'schema_version': 1,
              'updated_at': '2026-08-20',
              'status': 'ACTIVE_OVERRIDE / BUNDLE_016_020 / CURRENT_RECONCILED / MIGRATION_BOUNDARY_AFTER_020',
              'baseline': 'baselines/REVERSE_OUTLINE_2026-07-23_PILOT.json',
              'chapters': [by[n] for n in range(16, 21)],
          }
          (root / 'fiction/analysis/REVERSE_OUTLINE_OVERRIDE_016_020.json').write_text(
              json.dumps(out_16_20, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          out_21 = {
              'schema_version': 1,
              'updated_at': '2026-08-20',
              'status': 'ACTIVE_OVERRIDE / CH21_LEGACY_TAIL_BOUNDARY',
              'baseline': 'baselines/REVERSE_OUTLINE_2026-07-23_PILOT.json',
              'chapters': [by[21]],
          }
          (root / 'fiction/analysis/REVERSE_OUTLINE_OVERRIDE_021_MIGRATION_BOUNDARY.json').write_text(
              json.dumps(out_21, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          manifest_path = root / 'fiction/analysis/REVERSE_OUTLINE_001_225.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['overrides'] = [
              'REVERSE_OUTLINE_OVERRIDE_001_005.json',
              'REVERSE_OUTLINE_OVERRIDE_005_MIGRATION_BOUNDARY.json',
              'REVERSE_OUTLINE_OVERRIDE_006_010.json',
              'REVERSE_OUTLINE_OVERRIDE_011_015.json',
              'REVERSE_OUTLINE_OVERRIDE_016_020.json',
              'REVERSE_OUTLINE_OVERRIDE_021_MIGRATION_BOUNDARY.json',
              'REVERSE_OUTLINE_OVERRIDE_091_095.json',
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -f fiction/analysis/REVERSE_OUTLINE_OVERRIDE_016_MIGRATION_BOUNDARY.json
          rm -f .github/workflows/materialize-current-016-020-outline.yml
      - name: Verify generated composition and commit
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_fiction_reverse_outline.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'data: materialize current Ch016-020 reverse-outline state'
          git push origin HEAD:work/coc-promote-016-020-green-20260820
