name: Propagate current 011-015 machine state

on:
  push:
    branches:
      - work/coc-promote-011-015-20260820
    paths:
      - ".github/workflows/propagate-current-011-015.yml"

permissions:
  contents: write

jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/coc-promote-011-015-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble source and propagate machine-derived state
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          sys.path.insert(0, str((root / 'tools').resolve()))

          expected = {
              11: {'title':'비야키를 타는 법','pov':'주안','chars':13226,'sha':'b21d107fee15795235ec518fee82e4d5192884ce4948665d1ed36317e691e96d'},
              12: {'title':'못 본 척 해줄게','pov':'이안 → 엘리스 → 이안 → 엘리스 → 이안 → 엘리스 → 이안','chars':6650,'sha':'075905093ff62858acc367e92e368eeb6e9aff69f5b472257040cac398571e41'},
              13: {'title':'아버지 대신','pov':'이안 → 엘리스','chars':7096,'sha':'3d12e20c6a00efc1cba80baf2827b723b6115912f5427036e4a963226d95659c'},
              14: {'title':'후회하지 않는 선택','pov':'엘리스 → 주안 → 이안','chars':6732,'sha':'14d186deeba2eaf88ece52f55abaa11c48ab3c3abdda4fd7057e0cc1fd7b5544'},
              15: {'title':'섬의 왕과의 거래','pov':'엘리스 → 주안','chars':7453,'sha':'51017e43afd407efda9a9c745c6836cdaf23554942f848b6f65a12bca39fccb0'},
          }

          header = '''# 1부 《폭풍의 눈》 · 제11화~제15화

> 상태: current source/canon reconciled production candidate.
> source authority: `폭풍의눈_001-161_통합현행후보_20260820_QA_GREEN_NOT_PROMOTED.docx` / SHA256 `248d1e0076114c10724a480333421353c03ea4f76d5e629cf865c730796643d9`.
> reconciliation: chapters 11-15 source+canon reconciled; mixed-migration boundary moves after Ch15 only when coupled consumers and hosted validation are Green.

'''
          pieces = [Path(f'docs/fiction-ops/tmp/ch{n}_exact.md').read_text(encoding='utf-8').rstrip() for n in range(11,16)]
          manuscript_text = header + '\n\n'.join(pieces) + '\n'
          manuscript = root / 'fiction/manuscript/part-1/011-015.md'
          manuscript.write_text(manuscript_text, encoding='utf-8')

          chapter_re = re.compile(r'^## 제(\d+)화 · (.*?)\n\n\*\*POV:\*\* ([^\n]+)\n\n(.*?)(?=\n\n<!-- source-lines:)', re.M | re.S)
          observed = {}
          for m in chapter_re.finditer(manuscript_text):
              n = int(m.group(1))
              if n not in expected:
                  continue
              body = m.group(4).strip()
              observed[n] = (len(body), hashlib.sha256(body.encode('utf-8')).hexdigest())
              want = (expected[n]['chars'], expected[n]['sha'])
              print('CH', n, observed[n])
              if observed[n] != want:
                  raise SystemExit(f'chapter {n} mismatch: {observed[n]} != {want}')
          if set(observed) != set(expected):
              raise SystemExit(f'missing exact chapters: {set(expected)-set(observed)}')

          idx_override_path = root / 'fiction/analysis/MANUSCRIPT_INDEX_OVERRIDE_011_015.json'
          idx_override = {
              'schema_version': 1,
              'updated_at': '2026-08-20',
              'status': 'ACTIVE_OVERRIDE / BUNDLE_011_015 / CURRENT_RECONCILED',
              'baseline': 'analysis/baselines/MANUSCRIPT_INDEX_2026-07-23_PILOT.json',
              'chapters': [
                  {
                      'chapter': n,
                      'title': expected[n]['title'],
                      'pov': expected[n]['pov'],
                      'body_chars': expected[n]['chars'],
                      'body_sha256': expected[n]['sha'],
                      'bundle': 'fiction/manuscript/part-1/011-015.md',
                  }
                  for n in range(11,16)
              ],
          }
          idx_override_path.write_text(json.dumps(idx_override, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          idx_manifest_path = root / 'fiction/MANUSCRIPT_INDEX.json'
          idx_manifest = json.loads(idx_manifest_path.read_text(encoding='utf-8'))
          idx_manifest['generated_at'] = '2026-08-20'
          idx_manifest['status'] = 'ACTIVE / COMPOSED / 225_STORAGE_CHAPTERS / MIXED_MIGRATION / CURRENT_PREFIX_001_015'
          overrides = [x for x in idx_manifest['overrides'] if x != 'analysis/MANUSCRIPT_INDEX_OVERRIDE_011_015.json']
          insert_at = overrides.index('analysis/MANUSCRIPT_INDEX_OVERRIDE_091_095.json') if 'analysis/MANUSCRIPT_INDEX_OVERRIDE_091_095.json' in overrides else len(overrides)
          overrides.insert(insert_at, 'analysis/MANUSCRIPT_INDEX_OVERRIDE_011_015.json')
          idx_manifest['overrides'] = overrides
          idx_manifest_path.write_text(json.dumps(idx_manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          registry_path = root / 'fiction/analysis/SCENE_PASS_REGISTRY.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          rec = registry['external_artifact_reconciliation']
          rec['reconciled_prefix_end'] = 15
          rec['legacy_tail_starts_at'] = 16
          rec['boundary_after_chapter'] = 15
          rec['whole_manuscript_continuity'] = 'NOT_YET_CLAIMED'
          rec['rule'] = 'The QA_GREEN external candidate is the current revision input, not automatic GitHub production authority. Chapters 1-15 are now the bounded reconciled production prefix; stored chapters 16+ remain legacy-tail artifacts until their own 5-chapter promotion pass.'
          bundle_item = {
              'bundle': 'fiction/manuscript/part-1/011-015.md',
              'chapters': [11,12,13,14,15],
              'boundary_chapters': [10,16],
              'scene_cards': 'fiction/analysis/SCENE_CARDS_011_015.md',
              'revision_report': 'fiction/reports/REVISION_2026-08-20_CURRENT_RECONCILIATION_011_015.md',
              'source_files': [
                  {'name':'폭풍의눈_001-161_통합현행후보_20260820_QA_GREEN_NOT_PROMOTED.docx','sha256':'248d1e0076114c10724a480333421353c03ea4f76d5e629cf865c730796643d9','role':'current QA_GREEN revision input'},
                  {'name':'폭풍의눈_2차퇴고_제010화-제021화_모음.zip','role':'prior individualized final-correction cross-check'},
                  {'name':'fiction/CANON_REGISTRY.json','role':'current approved adaptation canon'},
              ],
              'chapter_shas': {str(n):expected[n]['sha'] for n in range(11,16)},
              'status': 'COMPLETE_CURRENT_CANDIDATE_CANON_RECONCILIATION / CURRENT_PREFIX / MIGRATION_BOUNDARY_AFTER_015',
          }
          passes = [x for x in registry.get('completed_bundle_passes',[]) if x.get('bundle') != bundle_item['bundle']]
          # keep production-prefix passes before historical side-story passes
          pos = next((i for i,x in enumerate(passes) if x.get('bundle') == 'fiction/manuscript/side-story-lake/091-095.md'), len(passes))
          passes.insert(pos, bundle_item)
          registry['completed_bundle_passes'] = passes
          registry['next_pass_mode'] = 'EXTERNAL_ARTIFACT_CANON_RECONCILIATION'
          registry['next_bundle_passes'] = ['fiction/manuscript/part-1/016-020.md']
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Build exact generator output after manuscript/index/frontier changes.
          from build_fiction_reverse_outline import build_current
          generated = {int(x['chapter']): x for x in build_current(root)['chapters']}

          # Ch10 was previously the left migration boundary; reconnect it to current Ch11.
          old_006_010_path = root / 'fiction/analysis/REVERSE_OUTLINE_OVERRIDE_006_010.json'
          old_006_010 = json.loads(old_006_010_path.read_text(encoding='utf-8'))
          old_006_010['updated_at'] = '2026-08-20'
          old_006_010['status'] = 'ACTIVE_OVERRIDE / BUNDLE_006_010 / CURRENT_RECONCILED / CURRENT_CONTINUITY_TO_CH11'
          old_006_010['chapters'] = [generated[int(x['chapter'])] if int(x['chapter']) == 10 else x for x in old_006_010['chapters']]
          old_006_010_path.write_text(json.dumps(old_006_010, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          current_outline = {
              'schema_version': 1,
              'updated_at': '2026-08-20',
              'status': 'ACTIVE_OVERRIDE / BUNDLE_011_015 / CURRENT_RECONCILED / MIGRATION_BOUNDARY_AFTER_015',
              'baseline': 'baselines/REVERSE_OUTLINE_2026-07-23_PILOT.json',
              'chapters': [generated[n] for n in range(11,16)],
          }
          (root / 'fiction/analysis/REVERSE_OUTLINE_OVERRIDE_011_015.json').write_text(json.dumps(current_outline, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          old_boundary = root / 'fiction/analysis/REVERSE_OUTLINE_OVERRIDE_011_MIGRATION_BOUNDARY.json'
          if old_boundary.exists():
              old_boundary.unlink()
          right_boundary = {
              'schema_version': 1,
              'updated_at': '2026-08-20',
              'status': 'ACTIVE_OVERRIDE / CH16_LEGACY_TAIL_BOUNDARY',
              'baseline': 'baselines/REVERSE_OUTLINE_2026-07-23_PILOT.json',
              'chapters': [generated[16]],
          }
          (root / 'fiction/analysis/REVERSE_OUTLINE_OVERRIDE_016_MIGRATION_BOUNDARY.json').write_text(json.dumps(right_boundary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          outline_manifest_path = root / 'fiction/analysis/REVERSE_OUTLINE_001_225.json'
          outline_manifest = json.loads(outline_manifest_path.read_text(encoding='utf-8'))
          outline_manifest['generated_at'] = '2026-08-20'
          outline_manifest['overrides'] = [
              'REVERSE_OUTLINE_OVERRIDE_001_005.json',
              'REVERSE_OUTLINE_OVERRIDE_005_MIGRATION_BOUNDARY.json',
              'REVERSE_OUTLINE_OVERRIDE_006_010.json',
              'REVERSE_OUTLINE_OVERRIDE_011_015.json',
              'REVERSE_OUTLINE_OVERRIDE_016_MIGRATION_BOUNDARY.json',
              'REVERSE_OUTLINE_OVERRIDE_091_095.json',
          ]
          outline_manifest_path.write_text(json.dumps(outline_manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print('machine state propagated: prefix=15 boundary=15→16')
          PY
      - name: Commit propagated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fiction/manuscript/part-1/011-015.md fiction/MANUSCRIPT_INDEX.json fiction/analysis/MANUSCRIPT_INDEX_OVERRIDE_011_015.json fiction/analysis/SCENE_PASS_REGISTRY.json fiction/analysis/REVERSE_OUTLINE_OVERRIDE_006_010.json fiction/analysis/REVERSE_OUTLINE_OVERRIDE_011_015.json fiction/analysis/REVERSE_OUTLINE_OVERRIDE_016_MIGRATION_BOUNDARY.json fiction/analysis/REVERSE_OUTLINE_001_225.json
          git add -u fiction/analysis/REVERSE_OUTLINE_OVERRIDE_011_MIGRATION_BOUNDARY.json || true
          if git diff --cached --quiet; then
            echo "no machine-state delta"
            exit 0
          fi
          git commit -m "fiction: propagate current 011-015 machine state"
          git push origin HEAD:work/coc-promote-011-015-20260820
