name: One-time regenerate Ch026-030 reverse outline

on:
  push:
    branches:
      - promote/026-030-current-source-20260824
    paths:
      - '.github/trigger-outline-026-030.txt'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/026-030-current-source-20260824
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate exact overrides
        run: |
          python tools/build_fiction_reverse_outline.py --materialize /tmp/generated.json
          python - <<'PY'
          import json
          from pathlib import Path

          generated = json.loads(Path('/tmp/generated.json').read_text(encoding='utf-8'))
          by = {int(x['chapter']): x for x in generated['chapters']}
          targets = [
              ('fiction/analysis/REVERSE_OUTLINE_OVERRIDE_021_025.json', range(21, 26)),
              ('fiction/analysis/REVERSE_OUTLINE_OVERRIDE_026_030.json', range(26, 31)),
              ('fiction/analysis/REVERSE_OUTLINE_OVERRIDE_031_MIGRATION_BOUNDARY.json', range(31, 32)),
          ]
          for rel, chapters in targets:
              path = Path(rel)
              data = json.loads(path.read_text(encoding='utf-8'))
              data['chapters'] = [by[n] for n in chapters]
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python tools/build_fiction_reverse_outline.py --check
      - name: Commit regenerated overrides
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fiction/analysis/REVERSE_OUTLINE_OVERRIDE_021_025.json fiction/analysis/REVERSE_OUTLINE_OVERRIDE_026_030.json fiction/analysis/REVERSE_OUTLINE_OVERRIDE_031_MIGRATION_BOUNDARY.json
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'fix: regenerate 026-030 reverse outline overrides'
            git push origin HEAD:promote/026-030-current-source-20260824
          fi
