name: Repair current 006-010 exact source

on:
  push:
    branches:
      - work/coc-promote-006-010-20260820
    paths:
      - ".github/workflows/repair-current-006-010.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/coc-promote-006-010-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild exact chapters 7-9
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          target = Path('fiction/manuscript/part-1/006-010.md')
          text = target.read_text(encoding='utf-8')
          for number in (7, 8, 9):
              staged = Path(f'docs/fiction-ops/tmp/ch{number}_exact.md').read_text(encoding='utf-8')
              next_number = number + 1
              pattern = re.compile(rf'^## 제{number}화 · .*?(?=^## 제{next_number}화 · )', re.M | re.S)
              text, count = pattern.subn(staged + '\n', text, count=1)
              if count != 1:
                  raise SystemExit(f'chapter {number} replacement count={count}')
          target.write_text(text, encoding='utf-8')

          expected = {
              6: (6506, 'b22b54836e90bead8aa73c1cc5ed4bc0eb04edd3a2356effd9dd01ddcbffa28d'),
              7: (5309, '71fecab94096819faa67b29706bf45e9fb67ee6a11a64b159665f39e25fd3ca2'),
              8: (5087, 'cccf0a1a59bdf1ed60a6616a4fc190c46458fa9892348405b187a63ad2e4163e'),
              9: (4580, 'ff54282bd4d18572881da4a8a11728da18ebbd21cff6e2feee0ce6367b1f3580'),
              10: (6696, '4a3e60159d639f4125bcc960032afead1aba8fb160097ab36f06488fb06ab211'),
          }
          chapter_re = re.compile(r'^## 제(\d+)화 · (.*?)\n\n\*\*POV:\*\* ([^\n]+)\n\n(.*?)(?=\n\n<!-- source-lines:)', re.M | re.S)
          seen = {}
          for match in chapter_re.finditer(text):
              n = int(match.group(1))
              if n not in expected:
                  continue
              body = match.group(4).strip()
              actual = (len(body), hashlib.sha256(body.encode('utf-8')).hexdigest())
              seen[n] = actual
              print(n, actual[0], actual[1])
              if actual != expected[n]:
                  raise SystemExit(f'chapter {n} exact-source mismatch: {actual} != {expected[n]}')
          if set(seen) != set(expected):
              raise SystemExit(f'missing chapters after rebuild: {set(expected)-set(seen)}')
          PY
      - name: Commit exact repaired manuscript
        run: |
          if git diff --quiet -- fiction/manuscript/part-1/006-010.md; then
            echo "no repair needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fiction/manuscript/part-1/006-010.md
          git commit -m "fix: restore exact current chapters 7-9"
          git push origin HEAD:work/coc-promote-006-010-20260820
