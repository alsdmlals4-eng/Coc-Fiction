name: Assemble current 011-015 exact source

on:
  push:
    branches:
      - work/coc-promote-011-015-20260820
    paths:
      - ".github/workflows/repair-current-011-015.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/coc-promote-011-015-20260820
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble exact bundle and verify hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          header = '''# 1부 《폭풍의 눈》 · 제11화~제15화

> 상태: current source/canon reconciled production candidate.
> source authority: `폭풍의눈_001-161_통합현행후보_20260820_QA_GREEN_NOT_PROMOTED.docx` / SHA256 `248d1e0076114c10724a480333421353c03ea4f76d5e629cf865c730796643d9`.
> reconciliation: chapters 11-15 source+canon reconciled; mixed-migration boundary moves after Ch15 only when coupled consumers and hosted validation are Green.

'''
          pieces = [Path(f'docs/fiction-ops/tmp/ch{n}_exact.md').read_text(encoding='utf-8').rstrip() for n in range(11, 16)]
          text = header + '\n\n'.join(pieces) + '\n'
          target = Path('fiction/manuscript/part-1/011-015.md')
          target.write_text(text, encoding='utf-8')

          expected = {
              11: (13226, 'b21d107fee15795235ec518fee82e4d5192884ce4948665d1ed36317e691e96d'),
              12: (6650, '075905093ff62858acc367e92e368eeb6e9aff69f5b472257040cac398571e41'),
              13: (7096, '3d12e20c6a00efc1cba80baf2827b723b6115912f5427036e4a963226d95659c'),
              14: (6732, '14d186deeba2eaf88ece52f55abaa11c48ab3c3abdda4fd7057e0cc1fd7b5544'),
              15: (7453, '51017e43afd407efda9a9c745c6836cdaf23554942f848b6f65a12bca39fccb0'),
          }
          chapter_re = re.compile(r'^## 제(\d+)화 · (.*?)\n\n\*\*POV:\*\* ([^\n]+)\n\n(.*?)(?=\n\n<!-- source-lines:)', re.M | re.S)
          seen = {}
          for m in chapter_re.finditer(text):
              n = int(m.group(1))
              if n not in expected:
                  continue
              body = m.group(4).strip()
              actual = (len(body), hashlib.sha256(body.encode('utf-8')).hexdigest())
              seen[n] = actual
              print(n, actual[0], actual[1])
              if actual != expected[n]:
                  raise SystemExit(f'chapter {n} exact-source mismatch: {actual} != {expected[n]}')
          if set(seen) != set(expected):
              raise SystemExit(f'missing chapters: {set(expected)-set(seen)}')
          PY
      - name: Commit exact production bundle
        run: |
          if git diff --quiet -- fiction/manuscript/part-1/011-015.md; then
            echo "no production delta"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fiction/manuscript/part-1/011-015.md
          git commit -m "fiction: restore exact current chapters 11-15"
          git push origin HEAD:work/coc-promote-011-015-20260820
